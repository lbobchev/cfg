# Shared Alacritty LIGHT base config — the "soft light" pole of the dark<->light
# cfg theme toggle. Identical to base.toml except for the inline [colors.*]
# palette: Modus Operandi Tinted (warm paper bg, WCAG AAA contrast) for
# bright-room / daytime coding.
# No theme plugin / no import — inline only. bin/theme-toggle.sh swaps the
# deployed base.toml symlink/copy between this file and base.toml (dark).
#
# The generated top-level alacritty.toml imports `base.toml` (the deployed name),
# so toggling just repoints that one file — no alacritty.toml edit needed.

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 300

[window]
startup_mode = "Fullscreen"
opacity = 1.0

# Modus Operandi Tinted (protesilaos/modus-themes): every colour >= 6.6:1 on the bg
[colors.primary]
background = "#fbf7f0"
foreground = "#000000"

[colors.cursor]
text = "#fbf7f0"
cursor = "#000000"

[colors.selection]
text = "CellForeground"
background = "#c2bcb5"

[colors.normal]
black   = "#000000"
red     = "#a60000"
green   = "#006300"
yellow  = "#6d5000"
blue    = "#0031a9"
magenta = "#721045"
cyan    = "#00598b"
white   = "#a6a6a6"

[colors.bright]
black   = "#595959"
red     = "#972500"
green   = "#00603f"
yellow  = "#894000"
blue    = "#3546c2"
magenta = "#531ab6"
cyan    = "#005f5f"
white   = "#ffffff"

# Claude Code's light-ansi theme draws inline code with xterm colour 153
# (#afd7ff, 1.4:1 on this bg). Remap it to Neovim's dark cyan.
[[colors.indexed_colors]]
index = 153
color = "#007373"
