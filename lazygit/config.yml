# Dark lazygit theme — e-ink charcoal. Paper-toned ink on the terminal's charcoal
# background (alacritty bg #212120 / fg #cfccc4); the only hue kept is red for
# unstaged changes. Pairs with alacritty base.toml / tmux .tmux-dark.conf.
gui:
  theme:
    activeBorderColor:
      - "#cfccc4"
      - bold
    inactiveBorderColor:
      - "#5c5a55"
    searchingActiveBorderColor:
      - "#cfccc4"
      - bold
    optionsTextColor:
      - "#8a877f"
    selectedLineBgColor:
      - "#34332f"
    cherryPickedCommitBgColor:
      - "#34332f"
    cherryPickedCommitFgColor:
      - "#cfccc4"
    unstagedChangesColor:
      - "#c47a70"
    defaultFgColor:
      - "#cfccc4"
    searchingActiveColor:
      - "#8a877f"
