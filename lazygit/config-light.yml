# Light lazygit theme — e-ink grey paper. Soft ink text on grey paper; the only
# hue kept is red for unstaged changes (a real signal worth preserving). Pairs
# with alacritty base-light.toml / tmux .tmux-light.conf. No plugin involved —
# just hex colours. toggle script repoints ~/.config/lazygit/config.yml between
# this file and config.yml (dark).
gui:
  theme:
    activeBorderColor:
      - "#2b2b2b"
      - bold
    inactiveBorderColor:
      - "#a8a49c"
    searchingActiveBorderColor:
      - "#2b2b2b"
      - bold
    optionsTextColor:
      - "#6b6b6b"
    selectedLineBgColor:
      - "#e3dfd6"
    cherryPickedCommitBgColor:
      - "#e3dfd6"
    cherryPickedCommitFgColor:
      - "#2b2b2b"
    unstagedChangesColor:
      - "#8a3a32"
    defaultFgColor:
      - "#2b2b2b"
    searchingActiveColor:
      - "#6b6b6b"
