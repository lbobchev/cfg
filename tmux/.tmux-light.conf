# Light status fragment — sourced by .tmux.conf when ~/.config/cfg-theme == light.
# Modus Operandi Tinted: matches alacritty light base (bg #fbf7f0 / fg #000000).
# bg=default lets the outer terminal's warm paper background show through.
set -g status-style "fg=#000000,bg=default"
set -g status-left-style "fg=#595959,bg=default"
set -g status-right-style "fg=#595959,bg=default"
setw -g window-status-style "fg=#595959,bg=default"
setw -g window-status-current-style "fg=#000000,bold,bg=default"
set -g message-style "fg=#fbf7f0,bg=#000000"
set -g pane-border-style "fg=#c2bcb5"
set -g pane-active-border-style "fg=#595959"
