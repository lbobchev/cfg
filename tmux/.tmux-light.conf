# Light status fragment — sourced by .tmux.conf when ~/.config/cfg-theme == light.
# E-ink grey paper: matches alacritty light base (bg #eeebe3 / fg #2b2b2b).
# bg=default lets the outer terminal's paper background show through.
set -g status-style "fg=#2b2b2b,bg=default"
set -g status-left-style "fg=#6b6b6b,bg=default"
set -g status-right-style "fg=#6b6b6b,bg=default"
setw -g window-status-style "fg=#6b6b6b,bg=default"
setw -g window-status-current-style "fg=#2b2b2b,bold,bg=default"
set -g message-style "fg=#eeebe3,bg=#2b2b2b"
set -g pane-border-style "fg=#c8c4bb"
set -g pane-active-border-style "fg=#6b6b6b"
