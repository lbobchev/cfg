# Dark status fragment — sourced by .tmux.conf when ~/.config/cfg-theme != light.
# E-ink charcoal: matches alacritty dark base (bg #212120 / fg #cfccc4).
# bg=default lets the outer terminal's charcoal background show through.
set -g status-style "fg=#cfccc4,bg=default"
set -g status-left-style "fg=#8a877f,bg=default"
set -g status-right-style "fg=#8a877f,bg=default"
setw -g window-status-style "fg=#8a877f,bg=default"
setw -g window-status-current-style "fg=#cfccc4,bold,bg=default"
set -g message-style "fg=#212120,bg=#cfccc4"
set -g pane-border-style "fg=#45433f"
set -g pane-active-border-style "fg=#8a877f"
